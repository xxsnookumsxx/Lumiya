buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.lumiyaviewer.lumiya'
    compileSdkVersion 26

    defaultConfig {
        applicationId "com.lumiyaviewer.lumiya"
        minSdkVersion 26
        targetSdkVersion 26
        versionCode 500
        versionName "5.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

// Note: useLibrary is deprecated and can conflict with newer Gradle versions
// The Apache HTTP legacy library usage should be handled via runtime dependencies instead

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java {
                srcDirs = ['sources']
                exclude 'com/lumiyaviewer/lumiya/R.java'
                exclude 'com/lumiyaviewer/lumiya/BuildConfig.java'
                exclude 'android/support/**/R.java'
            }
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['lib']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    aaptOptions {
        additionalParameters '--stable-ids', file('stable-ids.txt').absolutePath
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    // bundled-3p-libs is a flat-classpath artifact; exclude it from module metadata resolution
    implementation name: 'bundled-3p-libs', classifier: null, ext: '.jar'
}
